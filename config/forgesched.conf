# ForgeSched Configuration File

# Server settings
server.bind_ip=127.0.0.1
server.port=8080
server.io_threads=2
server.worker_threads=8

# Clients and Workers connect to this address (set to the Server's LAN IP on separate hosts).
network.server_ip=127.0.0.1
network.timeout_ms=5000

# Logging configuration
log.level=INFO
log.dir=./logs

# Database settings
database.path=./data/forgesched.db

# Scheduler settings
scheduler.max_running_tasks=32
scheduler.task_timeout_sec=10800

# Worker settings
worker.heartbeat_timeout_sec=30
worker.output_dir=./worker-output
# Paths on the Worker machine; required for production PJtest execution.
worker.test2_root=
worker.artifact_root=
# Set this on a PJtest machine, or pass --pjtest-config explicitly.
worker.pjtest_config=

# Optional manual shutdown test helper
tools.server_binary=./build/bin/server
