# ForgeSched Configuration File

# Server settings
server.bind_ip=127.0.0.1
server.port=8080
server.io_threads=2
server.worker_threads=8
server.templates_dir=./server/templates
# Used only by the optional scheduled submitter.
server.tasks_yaml=./server/Tasks.yaml
server.work_root=
server.artifact_root=
server.protect_versions_file=
server.clock_state_file=./data/clock-state.json

# Clients and Workers connect to this address (set to the Server's LAN IP on separate hosts).
network.server_ip=127.0.0.1
network.timeout_ms=5000

# Logging configuration
log.level=INFO
log.dir=./logs

# Database settings
database.path=./data/forgesched.db
database.busy_timeout_ms=5000
# Regression query cache; task and run state remain synchronously persisted.
cache.regression.enabled=false
cache.regression.max_entries=1000
cache.regression.ttl_seconds=5
# Retry proven-lost executions only; business failures are not automatically retried.
server.recovery_max_retries=1
server.worker_timeout_seconds=30
worker.reconnect_seconds=2

# Scheduler settings
scheduler.max_running_tasks=32
scheduler.task_timeout_sec=10800

# Worker settings
worker.output_dir=./worker-output
# The manager derives the machine name from this host and creates slot1..slotN.
worker.slots=1
worker.output_root=./worker-output
worker.checkout_parallelism=1
# Worker automatically checks out slots_root/WORKER_ID/galaxcore when missing.
# The checkout contains test2, flow, run.sh and vivado_runner.
worker.slots_root=./worker/workers_slots
worker.svn_url=
worker.svn_revision=
worker.artifact_root=
worker.clean=true
worker.terminate_grace_seconds=30
# Execution flow_config is captured by Server and sent with each task.

# Optional manual shutdown test helper
tools.server_binary=./build/bin/server

# Optional one-server/one-slot intranet acceptance test (tools/intranet_*_smoke.py).
# Set the same revision on both hosts. Paths are relative to each ForgeSched root.
smoke.revision=
smoke.case=
smoke.flow=route
smoke.target=
smoke.run_count=2
smoke.case_timeout_seconds=5400
smoke.expected_worker_id=
# Optional acceptance-test pin; leave blank to auto-discover registered slots.
smoke.expected_worker_ids=
# Require distinct registered machine IDs for the two-machine acceptance run.
smoke.require_distinct_machines=0
smoke.report_dir=./intranet-report
smoke.connect_wait_seconds=1200
smoke.wait_seconds=12000
