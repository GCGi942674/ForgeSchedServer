# ForgeSched Configuration File

# Server settings
server.bind_ip=127.0.0.1
server.port=8080
server.io_threads=2
server.worker_threads=8
server.templates_dir=./server/templates
# Used only by the optional scheduled submitter.
server.tasks_yaml=./server/Tasks.yaml
server.work_root=
server.artifact_root=
server.protect_versions_file=
server.clock_state_file=./data/clock-state.json

# Clients and Workers connect to this address (set to the Server's LAN IP on separate hosts).
network.server_ip=127.0.0.1
network.timeout_ms=5000

# Logging configuration
log.level=INFO
log.dir=./logs

# Database settings
database.path=./data/forgesched.db

# Scheduler settings
scheduler.max_running_tasks=32
scheduler.task_timeout_sec=10800

# Worker settings
worker.heartbeat_timeout_sec=30
worker.output_dir=./worker-output
# Worker automatically checks out slots_root/WORKER_ID/galaxcore when missing.
# The checkout contains test2, flow, run.sh and vivado_runner.
worker.slots_root=./worker/workers_slots
worker.svn_url=
worker.svn_revision=
worker.artifact_root=
worker.clean=true
worker.terminate_grace_seconds=30
# Execution flow_config is captured by Server and sent with each task.

# Optional manual shutdown test helper
tools.server_binary=./build/bin/server
