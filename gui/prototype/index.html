<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#dce7f7;background:#0a1020;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{display:grid;grid-template-columns:238px minmax(0,1fr);min-height:100vh}.side{background:#0d1729;border-right:1px solid #22314a;padding:24px 12px;display:flex;flex-direction:column;gap:26px}.brand{padding:4px 12px 12px;font-size:21px;font-weight:750;letter-spacing:.2px}.brand small{display:block;font-size:11px;color:#8192aa;font-weight:500;margin-top:5px;letter-spacing:1.5px}.nav{display:grid;gap:5px}.nav button{display:flex;gap:12px;align-items:center;width:100%;border:0;border-radius:9px;padding:12px;color:#a7b6cb;background:transparent;text-align:left}.nav button:hover,.nav button.active{background:#19304a;color:#e5f2ff}.nav button.active{box-shadow:inset 3px 0 #52c5b7}.nav .ico{font-size:16px;width:20px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #22314a;padding:16px 12px;color:#7f91a9;font-size:12px;line-height:1.8}.dot{display:inline-block;width:7px;height:7px;background:#41c6a7;border-radius:50%;margin-right:6px}.main{min-width:0;background:#0b1322;padding:26px 34px 40px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:#5ed2be;font-size:11px;font-weight:700;letter-spacing:1.6px}.top h1{font-size:26px;margin:7px 0 4px;letter-spacing:-.5px}.sub{color:#899bb3}.demo{font-size:12px;color:#93a8bd;border:1px solid #30435c;border-radius:20px;padding:8px 12px;white-space:nowrap}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:17px}.grow{flex:1}.field,select,input[type=date]{background:#121f33;color:#e5efff;border:1px solid #31435b;border-radius:8px;padding:10px 12px;outline:none;min-height:39px}.field:focus,select:focus,input[type=date]:focus{border-color:#57cbbb}.field::placeholder{color:#7487a0}.btn{background:#1d2d43;border:1px solid #344862;border-radius:8px;color:#dce9f8;padding:9px 13px;min-height:38px}.btn:hover{border-color:#5f849e}.btn.primary{background:#2eac9a;border-color:#43c4b0;color:#06211f;font-weight:700}.btn.danger{color:#f3a8aa;border-color:#684449}.btn.subtle{background:none;border-color:transparent}.panel{background:#111e30;border:1px solid #263a53;border-radius:12px}.pad{padding:18px}.sectiontitle{font-size:15px;font-weight:700;margin-bottom:13px}.muted{color:#8195ac}.sm{font-size:12px}.layout{display:grid;gap:16px}.cols{grid-template-columns:270px minmax(0,1fr)}.formcols{grid-template-columns:minmax(370px,1.3fr) minmax(340px,1fr)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric{padding:17px}.metric strong{display:block;font-size:23px;margin:7px 0 2px}.metric .mark{width:7px;height:7px;display:inline-block;border-radius:50%;margin-right:6px}.hostrow{width:100%;display:flex;justify-content:space-between;text-align:left;padding:14px;background:transparent;border:0;color:#dce7f7;border-radius:8px}.hostrow.active,.hostrow:hover{background:#1a3149}.hostrow small{display:block;color:#8297ad;margin-top:5px}.hostrow b{font-size:12px;color:#72d1bc}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{font-size:12px;color:#8196ae;text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid #2b3e55}.table td{padding:14px;border-bottom:1px solid #21344a}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#182a3e}.table a{color:#79d2c7;text-decoration:none;cursor:pointer}.table a:hover{text-decoration:underline}.pill{font-size:11px;display:inline-flex;align-items:center;border:1px solid;border-radius:20px;padding:3px 8px;font-weight:700}.ok{color:#6dd4b9;border-color:#316b62;background:#12342f}.bad{color:#f4a4aa;border-color:#7a4b54;background:#3b222e}.warn{color:#f8ca85;border-color:#84643c;background:#3c3022}.info{color:#9dbff1;border-color:#426083;background:#1d304a}.gray{color:#a7b5c7;border-color:#4a5c6d;background:#27313e}.splitline{border-top:1px solid #2b3e55;margin:16px 0}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kv span{display:block;color:#8396ad;font-size:12px;margin-bottom:5px}.kv b{font-weight:600}.stack{display:grid;gap:13px}.label{display:block;color:#a7bad1;font-size:12px;margin-bottom:7px}.input{width:100%}.tree{min-height:470px;max-height:58vh;overflow:auto;padding:10px}.tree-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;min-height:37px}.tree-row:hover{background:#1b3047}.tree-row input{accent-color:#49c4ac;width:16px;height:16px}.tree-row .folder{color:#e1bd78}.tree-row .case{color:#81c6e5}.indent-1{padding-left:27px}.indent-2{padding-left:44px}.indent-3{padding-left:61px}.indent-4{padding-left:78px}.stickybar{position:sticky;bottom:14px;background:#18304a;border:1px solid #3a5974;border-radius:11px;padding:13px 17px;display:flex;align-items:center;gap:12px;margin-top:16px;box-shadow:0 12px 25px #070f1eaa}.notice{padding:11px 14px;border:1px solid #4a5838;border-radius:8px;background:#273423;color:#d7e9b5;margin-bottom:16px}.tabs{display:flex;gap:6px;border-bottom:1px solid #2d425a;margin-bottom:0}.tabs button{background:none;color:#8da4bb;border:0;padding:12px 15px;border-bottom:2px solid transparent}.tabs button.active{color:#68d1bd;border-color:#68d1bd}.logview{display:grid;grid-template-columns:195px 1fr;min-height:320px}.logfiles{border-right:1px solid #293e54;padding:12px}.logfiles button{display:block;background:none;border:0;width:100%;text-align:left;padding:9px;color:#9fb1c8;border-radius:7px}.logfiles button.active,.logfiles button:hover{background:#1d354d;color:#e4f2ff}pre{white-space:pre-wrap;word-break:break-word;color:#d4e5f3;font:12px/1.7 "Cascadia Code",Consolas,monospace;margin:0;padding:18px;overflow:auto;max-height:440px}.compare-summary{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.stat{padding:8px 12px;border:1px solid #33465f;border-radius:8px;color:#b3c3d6}.stat b{color:white}.stat.active{background:#234438;border-color:#4bb695}.drawer{position:fixed;inset:0;background:#020a13b8;display:none;justify-content:flex-end;z-index:8}.drawer.show{display:flex}.drawer-content{width:min(780px,100vw);height:100vh;background:#111f32;border-left:1px solid #3a536c;padding:25px;overflow:auto}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.drawer h2{margin:0;font-size:20px}.empty{color:#8ca0b7;padding:30px;text-align:center}.modal{position:fixed;inset:0;background:#020a13c7;display:none;align-items:center;justify-content:center;z-index:9}.modal.show{display:flex}.modal-card{width:min(480px,calc(100vw - 30px));background:#15263a;border:1px solid #52667a;border-radius:13px;padding:22px;box-shadow:0 20px 70px #0008}.modal-card h3{margin:0 0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:940px){.app{grid-template-columns:65px 1fr}.brand{font-size:13px;padding:5px 0;text-align:center}.brand small,.nav .txt,.sidefoot{display:none}.nav button{justify-content:center}.cols,.formcols{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.main{padding:20px}.demo{display:none}}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}.detailgrid{grid-template-columns:1fr 1fr}.logview{grid-template-columns:1fr}.logfiles{border-right:0;border-bottom:1px solid #293e54}.top{display:block}}

<body><div class="app"><aside class="side"><div class="brand">◇ GCRP<small>CONTROL CENTER</small></div><nav class="nav" id="nav"></nav><div class="sidefoot"><span class="dot"></span>本地交互原型<br>所有数据为示例，保存在浏览器本地</div></aside><main class="main"><div class="top"><div><div class="eyebrow">GCRP / WORKSPACE</div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="demo">● 原型模式 · 未连接服务端</div></div><div id="view"></div></main></div><div class="drawer" id="drawer"><div class="drawer-content" id="drawerContent"></div></div><div class="modal" id="modal"><div class="modal-card" id="modalContent"></div></div>
<script>
const CASES=[{path:'kintexuplus/xcku3p-ffvd900-1-i/convergentRoundingEven/run.tcl',label:'convergentRoundingEven',group:'xcku3p-ffvd900-1-i'},{path:'kintexuplus/xcku3p-ffvd900-1-i/shiftRegister/run.tcl',label:'shiftRegister',group:'xcku3p-ffvd900-1-i'},{path:'kintexuplus/xcku3p-ffvd900-1-i/ramBlock/run.tcl',label:'ramBlock',group:'xcku3p-ffvd900-1-i'},{path:'kintexuplus/xcku5p-ffvb676-2-e/counterCore/run.tcl',label:'counterCore',group:'xcku5p-ffvb676-2-e'},{path:'kintexuplus/xcku5p-ffvb676-2-e/uartTx/run.tcl',label:'uartTx',group:'xcku5p-ffvb676-2-e'}];
const BASE=[{id:10001,name:'每日 route 回归',source:'clock',date:'2026-10-12',version:'18954',flow:'route',status:'SUCCEEDED',count:5,done:5,worker:'novarch4-slot1',cases:CASES.map(c=>c.path)},{id:10002,name:'冒烟测试',source:'manual',date:'2026-10-12',version:'18954',flow:'route',status:'RUNNING',count:2,done:1,worker:'novarch3-slot1',cases:CASES.slice(0,2).map(c=>c.path)},{id:10003,name:'bitstream 验证',source:'manual',date:'2026-10-11',version:'18953',flow:'bitstream',status:'QUEUED',count:3,done:0,worker:'—',cases:CASES.slice(0,3).map(c=>c.path)},{id:10004,name:'临时对照',source:'manual',date:'2026-10-11',version:'18953',flow:'route',status:'CANCELLED',count:2,done:0,worker:'—',cases:CASES.slice(1,3).map(c=>c.path)}];
const REG={ '2026-10-10':{version:'18950',state:['PASS','PASS','PASS','FAIL','PASS']},'2026-10-11':{version:'18953',state:['PASS','FAIL','PASS','FAIL','PASS']},'2026-10-12':{version:'18954',state:['FAIL','PASS','PASS','FAIL','PASS']}};
const LOGS={"stdout.log":'[RUN] testcase: convergentRoundingEven\n[FLOW] route_design / write_bitstream\n[INFO] GalaxCore initialized\n[INFO] comparison completed\n[RESULT] PASS',"stderr.log":'[INFO] no fatal errors\n[INFO] warnings: 0',"run.log":'[12:03:14] run.sh started\n[12:03:18] route_design\n[12:04:11] write_bitstream\n[12:04:25] compare artifacts\n[12:04:26] finished',"result.env":'STATUS=PASS\nREASON=COMPARE_ARTIFACTS_PASS\nSTAGE=compare\nRET_CODE=0\nRUNTIME_SEC=72',"flow_config":'route_design 1\nwrite_bitstream 1\nbit_cmp 1\nmsk_cmp 1'};
const HOSTS=[{name:'novarch3',online:1,total:1,last:'10 秒前',slots:[{name:'slot1',state:'ONLINE',run:'RUNNING',task:'#10002 冒烟测试',case:'shiftRegister',since:'11:24',version:'18954'}]},{name:'novarch4',online:3,total:5,last:'8 秒前',slots:[{name:'slot1',state:'ONLINE',run:'BUSY',task:'#10001 每日 route 回归',case:'convergentRoundingEven',since:'10:31',version:'18954'},{name:'slot2',state:'ONLINE',run:'BUSY',task:'#10001 每日 route 回归',case:'ramBlock',since:'10:34',version:'18954'},{name:'slot3',state:'ONLINE',run:'IDLE',task:'—',case:'—',since:'—',version:'—'},{name:'slot4',state:'OFFLINE',run:'—',task:'—',case:'—',since:'—',version:'—'},{name:'slot5',state:'OFFLINE',run:'—',task:'—',case:'—',since:'—',version:'—'}]}];
const NAV=[['workers','◫','工作机状态'],['tasks','☷','任务管理'],['add','⊞','添加任务'],['regression','⇄','每日回归对比']];
const S={page:'workers',host:'novarch4',selected:new Set(),treeSearch:'',taskSearch:'',taskFilter:'all',dateA:'2026-10-11',dateB:'2026-10-12',category:'all',logFile:'stdout.log',regCase:0,regSide:'B',form:{name:'自定义批次',version:'18954',flow:'route',priority:'0',timeout:'5400'}};
let tasks=loadTasks();function loadTasks(){try{return JSON.parse(localStorage.getItem('gcrp-prototype-tasks'))||structuredClone(BASE)}catch{return structuredClone(BASE)}}function save(){localStorage.setItem('gcrp-prototype-tasks',JSON.stringify(tasks))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function code(x){let t={SUCCEEDED:['完成','ok'],RUNNING:['运行中','info'],QUEUED:['排队中','warn'],CANCELLED:['已取消','gray'],FAILED:['失败','bad'],ONLINE:['在线','ok'],OFFLINE:['离线','gray'],BUSY:['忙碌','info'],IDLE:['空闲','ok'],PASS:['PASS','ok'],FAIL:['FAIL','bad']};let v=t[x]||[x,'gray'];return `<span class="pill ${v[1]}">${v[0]}</span>`}function button(text,fn,extra=''){return `<button class="btn ${extra}" onclick="${fn}">${text}</button>`}function metric(label,value,detail,color='#50c6a8'){return `<div class="panel metric"><span class="muted sm"><i class="mark" style="background:${color}"></i>${label}</span><strong>${value}</strong><span class="muted sm">${detail}</span></div>`}
function go(p){S.page=p;closeDrawer();render()}function render(){document.querySelector('#nav').innerHTML=NAV.map(([id,ic,name])=>`<button class="${S.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span><span class="txt">${name}</span></button>`).join('');let map={workers:['工作机状态','按服务器查看工作 slot 的连接和运行状态'],tasks:['任务管理','查看、取消和删除任务记录；每日定时任务来源单独标识'],add:['添加任务','从 test2 的目录树选择 testcase，预览后创建批次'],regression:['每日回归对比','仅纳入 Clock 定时任务，按日期对比测试结果']};document.querySelector('#title').textContent=map[S.page][0];document.querySelector('#subtitle').textContent=map[S.page][1];document.querySelector('#view').innerHTML=({workers:workers,tasks:taskView,add:addView,regression:regressionView})[S.page]();if(S.page==='add')syncTreeChecks()}
function workers(){let host=HOSTS.find(h=>h.name===S.host),all=HOSTS.flatMap(h=>h.slots);return `<div class="metrics">${metric('工作服务器',HOSTS.length,'已注册主机')}${metric('在线 slot',all.filter(x=>x.state==='ONLINE').length,'共 '+all.length+' 个 slot')}${metric('运行中',all.filter(x=>x.run==='BUSY'||x.run==='RUNNING').length,'可进入任务详情','#79aaff')}${metric('离线',all.filter(x=>x.state==='OFFLINE').length,'保留最后已知状态','#ec9a9a')}</div><div class="toolbar"><input class="field" placeholder="搜索服务器或 slot" oninput="document.querySelectorAll('.hostrow').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><span class="grow"></span>${button('刷新示例状态','render()')}</div><div class="layout cols"><div class="panel pad"><div class="sectiontitle">工作服务器</div>${HOSTS.map(h=>`<button class="hostrow ${h.name===S.host?'active':''}" onclick="S.host='${h.name}';render()"><span><strong>${h.name}</strong><small>${h.online}/${h.total} 在线 · 最近心跳 ${h.last}</small></span><b>查看 ›</b></button>`).join('')}</div><div class="panel"><div class="pad"><div class="sectiontitle">${host.name} <span class="muted sm">/ 子 slot</span></div><div class="detailgrid">${[['在线 slot',host.online+'/'+host.total],['当前任务',host.slots.filter(s=>s.run==='BUSY'||s.run==='RUNNING').length+' 个运行中'],['最后心跳',host.last]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>子 slot</th><th>连接</th><th>运行</th><th>当前任务 / case</th><th>版本</th><th>开始</th></tr></thead><tbody>${host.slots.map(s=>`<tr><td><b>${s.name}</b></td><td>${code(s.state)}</td><td>${s.run==='—'?'—':code(s.run)}</td><td>${s.task==='—'?'—':`<a onclick="openTask(${Number(s.task.match(/\d+/)[0])})">${s.task}</a><div class="muted sm">${s.case}</div>`}</td><td>${s.version}</td><td>${s.since}</td></tr>`).join('')}</tbody></table></div><div class="pad muted sm">原型展示主机与 slot 的层级；上线、下线控制在后续版本补齐。</div></div></div>`}
function taskView(){let shown=tasks.filter(t=>(S.taskFilter==='all'||t.source===S.taskFilter)&&(`${t.name} ${t.id} ${t.version}`.toLowerCase().includes(S.taskSearch.toLowerCase())));return `<div class="toolbar"><input class="field" placeholder="搜索任务 ID / 名称 / 版本" value="${esc(S.taskSearch)}" oninput="S.taskSearch=this.value;render()"><select onchange="S.taskFilter=this.value;render()"><option value="all" ${S.taskFilter==='all'?'selected':''}>全部来源</option><option value="manual" ${S.taskFilter==='manual'?'selected':''}>人工任务</option><option value="clock" ${S.taskFilter==='clock'?'selected':''}>Clock 每日回归</option></select><span class="grow"></span>${button('＋ 添加任务',"go('add')",'primary')}</div><div class="panel tablewrap"><table class="table"><thead><tr><th>任务 / 批次</th><th>来源</th><th>日期</th><th>版本 · flow</th><th>进度</th><th>状态</th><th>操作</th></tr></thead><tbody>${shown.map(t=>`<tr><td><a onclick="openTask(${t.id})">#${t.id} ${esc(t.name)}</a></td><td>${t.source==='clock'?'定时回归':'人工添加'}</td><td>${t.date}</td><td>${esc(t.version)} · ${esc(t.flow)}</td><td>${t.done}/${t.count}</td><td>${code(t.status)}</td><td>${button('查看',`openTask(${t.id})`,'subtle')} ${t.status==='QUEUED'||t.status==='RUNNING'?button('取消',`cancelTask(${t.id})`,'subtle'):''} ${button('删除',`deleteTask(${t.id})`,'subtle')}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">没有匹配任务</td></tr>`}</tbody></table></div><p class="muted sm">原型规则：取消保留记录；运行中仅停止尚未执行的 case；运行中的任务记录不可删除。</p>`}
function closeDrawer(){document.querySelector('#drawer').classList.remove('show')}function showDrawer(html){document.querySelector('#drawerContent').innerHTML=html;document.querySelector('#drawer').classList.add('show')}function closeModal(){document.querySelector('#modal').classList.remove('show')}function showModal(html){document.querySelector('#modalContent').innerHTML=html;document.querySelector('#modal').classList.add('show')}
function openTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;showDrawer(`<div class="drawer-head"><h2>#${t.id} ${esc(t.name)}</h2>${button('关闭','closeDrawer()')}</div><div class="detailgrid">${[['来源',t.source==='clock'?'Clock 每日回归':'人工添加'],['状态',code(t.status)],['日期',t.date],['版本',esc(t.version)],['flow',esc(t.flow)],['进度',t.done+'/'+t.count]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="splitline"></div><div class="sectiontitle">testcase 清单</div><div class="panel tablewrap"><table class="table"><thead><tr><th>例子</th><th>状态</th><th>日志</th></tr></thead><tbody>${t.cases.map((p,i)=>`<tr><td>${esc(p)}</td><td>${i<t.done?code(i===0&&t.source==='clock'?'FAIL':'PASS'):code(t.status==='CANCELLED'?'CANCELLED':'QUEUED')}</td><td>${i<t.done?button('查看日志',`openLogs(${id},${i})`,'subtle'):'—'}</td></tr>`).join('')}</tbody></table></div><p class="muted sm">示例日志展示执行尝试的 stdout、stderr、run.log、result.env 和 flow_config。</p>`) }
function openLogs(id,i){let t=tasks.find(x=>x.id===id);S.logFile='stdout.log';S.logTask=id;S.logIndex=i;let filename=t.cases[i].split('/').at(-2);showDrawer(`<div class="drawer-head"><h2>执行日志 · ${esc(filename)}</h2>${button('关闭','closeDrawer()')}</div><p class="muted">#${id} / attempt 1 · ${esc(t.version)} · ${esc(t.flow)} · ${i===0&&t.source==='clock'?code('FAIL'):code('PASS')}</p><div class="panel logview"><div class="logfiles" id="logfiles"></div><pre id="logbody"></pre></div><p class="muted sm">所有日志为演示内容；正式版需要 Worker 上传每次执行的完整文件到 Server。</p>`);renderLog()}
function renderLog(){document.querySelector('#logfiles').innerHTML=Object.keys(LOGS).map(k=>`<button class="${S.logFile===k?'active':''}" onclick="S.logFile='${k}';renderLog()">▤ ${k}</button>`).join('');let t=tasks.find(x=>x.id===S.logTask),fail=S.logIndex===0&&t.source==='clock';let txt=LOGS[S.logFile];if(fail)txt=txt.replaceAll('PASS','FAIL').replaceAll('no fatal errors','comparison mismatch').replaceAll('COMPARE_ARTIFACTS_PASS','COMPARE_ARTIFACTS_FAIL');document.querySelector('#logbody').textContent=txt}
function cancelTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;showModal(`<h3>取消任务 #${id}？</h3><p class="muted">未开始的 ${t.count-t.done} 个 testcase 将取消；正在运行的 testcase 会继续执行。记录仍可查询。</p><div class="modal-actions">${button('返回','closeModal()')} ${button('确认取消',`confirmCancel(${id})`,'danger')}</div>`)}function confirmCancel(id){let t=tasks.find(x=>x.id===id);if(t){t.status='CANCELLED';save()}closeModal();closeDrawer();render()}function deleteTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;if(t.status==='RUNNING'||t.status==='QUEUED'){showModal(`<h3>暂不能删除</h3><p class="muted">任务仍在运行或排队。请先取消并等待运行中的 testcase 结束。</p><div class="modal-actions">${button('知道了','closeModal()')}</div>`);return}showModal(`<h3>删除任务记录 #${id}？</h3><p class="muted">这会从原型的任务列表删除该条记录；取消操作与删除操作分开。</p><div class="modal-actions">${button('返回','closeModal()')} ${button('删除记录',`confirmDelete(${id})`,'danger')}</div>`)}function confirmDelete(id){tasks=tasks.filter(t=>t.id!==id);save();closeModal();closeDrawer();render()}
function addView(){let q=S.treeSearch.toLowerCase(),matched=CASES.filter(c=>`${c.path} ${c.label}`.toLowerCase().includes(q));let groups=[...new Set(matched.map(c=>c.group))];return `<div class="layout formcols"><div class="panel"><div class="pad"><div class="sectiontitle">选择 testcase <span class="muted sm">/ 服务端 test2 目录</span></div><input class="field input" placeholder="搜索目录或 testcase" value="${esc(S.treeSearch)}" oninput="S.treeSearch=this.value;render()"><p class="muted sm">勾选目录将选中其下所有 run.tcl，搜索不会清除选择。</p></div><div class="tree"><div class="tree-row"><input type="checkbox" data-path="" onchange="togglePath('',this.checked)"><span class="folder">▾</span> test2 <span class="muted sm">(${CASES.length})</span></div>${groups.length?`<div class="tree-row indent-1"><input type="checkbox" data-path="kintexuplus" onchange="togglePath('kintexuplus',this.checked)"><span class="folder">▾</span> kintexuplus</div>`:''}${groups.map(g=>`<div class="tree-row indent-2"><input type="checkbox" data-path="kintexuplus/${g}" onchange="togglePath('kintexuplus/${g}',this.checked)"><span class="folder">▾</span> ${g}</div>${matched.filter(c=>c.group===g).map(c=>`<div class="tree-row indent-3"><input type="checkbox" data-path="${esc(c.path)}" onchange="togglePath('${c.path}',this.checked)"><span class="case">◇</span> ${esc(c.label)} <span class="muted sm">/ run.tcl</span></div>`).join('')}`).join('')}${!matched.length?'<div class="empty">没有匹配的 testcase</div>':''}</div></div><div class="panel pad"><div class="sectiontitle">批次设置</div><div class="stack"><div><label class="label">批次名称</label><input class="field input" value="${esc(S.form.name)}" oninput="S.form.name=this.value"></div><div><label class="label">GalaxCore 版本</label><input class="field input" value="${esc(S.form.version)}" oninput="S.form.version=this.value"></div><div><label class="label">flow 模板</label><select class="input" onchange="S.form.flow=this.value"><option ${S.form.flow==='route'?'selected':''}>route</option><option ${S.form.flow==='bitstream'?'selected':''}>bitstream</option></select></div><div class="detailgrid"><div><label class="label">优先级</label><input class="field input" type="number" value="${esc(S.form.priority)}" oninput="S.form.priority=this.value"></div><div><label class="label">单 case 超时（秒）</label><input class="field input" type="number" value="${esc(S.form.timeout)}" oninput="S.form.timeout=this.value"></div></div><div class="notice sm">flow_config 由服务端模板提供；预览时显示实际配置快照。</div></div></div></div><div class="stickybar"><strong id="selectedCount">已选 ${S.selected.size} 个 testcase</strong><span class="grow"></span>${button('清空选择',"S.selected.clear();render()")}${button('预览并提交','preview()', 'primary')}</div>`}
function syncTreeChecks(){document.querySelectorAll('[data-path]').forEach(e=>{let paths=CASES.filter(c=>c.path.startsWith(e.dataset.path)).map(c=>c.path);let n=paths.filter(p=>S.selected.has(p)).length;e.checked=paths.length>0&&n===paths.length;e.indeterminate=n>0&&n<paths.length});let counter=document.querySelector('#selectedCount');if(counter)counter.textContent=`已选 ${S.selected.size} 个 testcase`}function togglePath(path,on){for(let c of CASES)if(c.path.startsWith(path)){if(on)S.selected.add(c.path);else S.selected.delete(c.path)}syncTreeChecks()}function preview(){if(!S.selected.size){showModal(`<h3>尚未选择 testcase</h3><p class="muted">请先在左侧目录树选择至少一个 run.tcl。</p><div class="modal-actions">${button('返回','closeModal()')}</div>`);return}let paths=[...S.selected];showModal(`<h3>确认提交批次</h3><p class="muted">${esc(S.form.name)} · ${esc(S.form.version)} · ${esc(S.form.flow)} · ${paths.length} 个 testcase</p><div style="max-height:180px;overflow:auto" class="sm">${paths.map(x=>`<p>${esc(x)}</p>`).join('')}</div><p class="muted sm">此操作只会向本地原型添加一条人工任务。</p><div class="modal-actions">${button('返回','closeModal()')}${button('确认提交','submitMock()','primary')}</div>`)}function submitMock(){let id=Math.max(10000,...tasks.map(t=>t.id))+1;tasks.unshift({id,name:S.form.name||'自定义批次',source:'manual',date:'2026-10-13',version:S.form.version,flow:S.form.flow,status:'QUEUED',count:S.selected.size,done:0,worker:'—',cases:[...S.selected]});save();S.selected.clear();closeModal();go('tasks');openTask(id)}
function comparison(){let a=REG[S.dateA],b=REG[S.dateB];if(!a||!b)return[];return CASES.map((c,i)=>{let x=a.state[i],y=b.state[i];let category=x==='PASS'&&y==='FAIL'?'regressed':x==='FAIL'&&y==='PASS'?'fixed':x==='PASS'&&y==='PASS'?'pass':'fail';return {...c,a:x,b:y,category,index:i}})}function catLabel(c){return ({regressed:'新回退',fixed:'新通过',pass:'持续通过',fail:'持续失败'})[c]}function regressionView(){let rows=comparison(),shown=rows.filter(r=>S.category==='all'||r.category===S.category);return `<div class="toolbar"><span class="muted sm">基准日期</span><select onchange="S.dateA=this.value;render()">${Object.keys(REG).map(d=>`<option ${S.dateA===d?'selected':''}>${d}</option>`).join('')}</select><span class="muted sm">对比</span><span class="muted sm">比较日期</span><select onchange="S.dateB=this.value;render()">${Object.keys(REG).map(d=>`<option ${S.dateB===d?'selected':''}>${d}</option>`).join('')}</select><span class="grow"></span><span class="muted sm">来源：Clock 每日定时批次</span></div>${S.dateA===S.dateB?'<div class="notice">请选择两个不同日期。</div>':''}<div class="metrics">${metric('新回退',rows.filter(x=>x.category==='regressed').length,'PASS → FAIL','#f39da0')}${metric('新通过',rows.filter(x=>x.category==='fixed').length,'FAIL → PASS','#64d5ac')}${metric('持续通过',rows.filter(x=>x.category==='pass').length,'两天均通过','#75baff')}${metric('持续失败',rows.filter(x=>x.category==='fail').length,'两天均失败','#e7ba6a')}</div><div class="panel pad"><div class="sectiontitle">每日回归对比 <span class="muted sm">${S.dateA}（r${REG[S.dateA].version}） ↔ ${S.dateB}（r${REG[S.dateB].version}）</span></div><div class="compare-summary">${[['all','全部',rows.length],['regressed','新回退',rows.filter(x=>x.category==='regressed').length],['fixed','新通过',rows.filter(x=>x.category==='fixed').length],['pass','持续通过',rows.filter(x=>x.category==='pass').length],['fail','持续失败',rows.filter(x=>x.category==='fail').length]].map(([k,t,n])=>`<button class="btn stat ${S.category===k?'active':''}" onclick="S.category='${k}';render()">${t} <b>${n}</b></button>`).join('')}</div><div class="tablewrap"><table class="table"><thead><tr><th>testcase</th><th>flow</th><th>${S.dateA}<div>r${REG[S.dateA].version}</div></th><th>${S.dateB}<div>r${REG[S.dateB].version}</div></th><th>变化</th><th>日志</th></tr></thead><tbody>${shown.map(r=>`<tr><td><a onclick="openRegressionCase(${r.index})">${esc(r.label)}</a><div class="muted sm">${esc(r.group)}</div></td><td>route</td><td>${code(r.a)}</td><td>${code(r.b)}</td><td><span class="pill ${r.category==='regressed'?'bad':r.category==='fixed'?'ok':'gray'}">${catLabel(r.category)}</span></td><td>${button('两天日志',`openRegressionCase(${r.index})`,'subtle')}</td></tr>`).join('')}</tbody></table></div><p class="muted sm">人工添加的批次不纳入每日回归；成功与失败结果均可打开各自日志。版本仅作为当天运行信息展示。</p></div>`}
function openRegressionCase(i){S.regCase=i;S.regSide='B';S.logFile='stdout.log';renderRegressionCase()}function renderRegressionCase(){let c=CASES[S.regCase],a=REG[S.dateA].state[S.regCase],b=REG[S.dateB].state[S.regCase];showDrawer(`<div class="drawer-head"><h2>${esc(c.label)}</h2>${button('关闭','closeDrawer()')}</div><p class="muted sm">${esc(c.path)}</p><div class="detailgrid"><div class="kv"><span>${S.dateA} · r${REG[S.dateA].version}</span><b>${code(a)}</b></div><div class="kv"><span>${S.dateB} · r${REG[S.dateB].version}</span><b>${code(b)}</b></div><div class="kv"><span>flow</span><b>route</b></div></div><div class="splitline"></div><div class="tabs"><button class="${S.regSide==='A'?'active':''}" onclick="S.regSide='A';renderRegressionCase()">${S.dateA} 的日志</button><button class="${S.regSide==='B'?'active':''}" onclick="S.regSide='B';renderRegressionCase()">${S.dateB} 的日志</button></div><div class="panel logview"><div class="logfiles">${Object.keys(LOGS).map(k=>`<button class="${S.logFile===k?'active':''}" onclick="S.logFile='${k}';renderRegressionCase()">▤ ${k}</button>`).join('')}</div><pre>${esc((S.regSide==='A'?a:b)==='FAIL'?LOGS[S.logFile].replaceAll('PASS','FAIL').replaceAll('COMPARE_ARTIFACTS_PASS','COMPARE_ARTIFACTS_FAIL'):LOGS[S.logFile])}</pre></div><p class="muted sm">原型日志是示例文本；正式版需服务端保存两天各次执行的原始日志。</p>`)}
document.querySelector('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDrawer();closeModal()}});document.addEventListener('input',e=>{let p=e.target.placeholder;if(p==='搜索目录或 testcase'||p==='搜索任务 ID / 名称 / 版本'){let pos=e.target.selectionStart;setTimeout(()=>{let next=[...document.querySelectorAll('input')].find(x=>x.placeholder===p);if(next){next.focus();next.setSelectionRange(pos,pos)}},0)}},true);render();
</script></body></html>
